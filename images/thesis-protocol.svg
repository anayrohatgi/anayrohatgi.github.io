<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">MTT protocol iterations, Tests 1 to 4</title>
  <desc id="d">Matrix of four protocol variables across four test iterations. Highlighted cells changed from the previous test.</desc>
  <style>
    .ink{fill:#1A2230}.muted{fill:#5B6472}
    .h{font:700 26px "Archivo","Helvetica Neue",Arial,sans-serif}
    .sub{font:400 15px "Source Serif 4",Georgia,serif}
    .col{font:700 17px "Archivo","Helvetica Neue",Arial,sans-serif}
    .lab{font:600 15px "Archivo","Helvetica Neue",Arial,sans-serif}
    .v{font:500 15px "Archivo","Helvetica Neue",Arial,sans-serif}
    .note{font:400 14px "Archivo","Helvetica Neue",Arial,sans-serif}
    .same{fill:#EEF3F2}.chg{fill:#8F3577}.none{fill:none;stroke:#C9CED6;stroke-dasharray:4 4}
    .on{fill:#FFFFFF}
  </style>

  <text class="h ink" x="24" y="44">Protocol iterations</text>
  <text class="sub muted" x="24" y="70">Each test changed the prep protocol to remove acidity artifacts.</text>
  <rect class="chg" x="700" y="56" width="16" height="16" rx="3"/>
  <text class="note muted" x="724" y="69">Changed from previous test</text>

  <!-- column headers -->
  <g class="col ink" text-anchor="middle">
    <text x="360" y="140">Test 1</text><text x="528" y="140">Test 2</text>
    <text x="696" y="140">Test 3</text><text x="864" y="140">Test 4</text>
  </g>
  <line x1="24" y1="154" x2="944" y2="154" stroke="#1A2230" stroke-width="1.5"/>

  <!-- row labels -->
  <g class="lab ink">
    <text x="24" y="197">UV sterilization</text>
    <text x="24" y="261">70% ethanol soak</text>
    <text x="24" y="325">PBS step</text>
    <text x="24" y="389">Well plate</text>
  </g>

  <!-- cells: columns at x=280,448,616,784 (w=160); rows at y=164,228,292,356 (h=56) -->
  <g>
    <!-- UV -->
    <rect class="same" x="280" y="164" width="160" height="56" rx="4"/>
    <rect class="same" x="448" y="164" width="160" height="56" rx="4"/>
    <rect class="same" x="616" y="164" width="160" height="56" rx="4"/>
    <rect class="chg"  x="784" y="164" width="160" height="56" rx="4"/>
    <!-- Ethanol -->
    <rect class="none" x="280" y="228" width="160" height="56" rx="4"/>
    <rect class="chg"  x="448" y="228" width="160" height="56" rx="4"/>
    <rect class="same" x="616" y="228" width="160" height="56" rx="4"/>
    <rect class="same" x="784" y="228" width="160" height="56" rx="4"/>
    <!-- PBS -->
    <rect class="none" x="280" y="292" width="160" height="56" rx="4"/>
    <rect class="none" x="448" y="292" width="160" height="56" rx="4"/>
    <rect class="chg"  x="616" y="292" width="160" height="56" rx="4"/>
    <rect class="chg"  x="784" y="292" width="160" height="56" rx="4"/>
    <!-- Plate -->
    <rect class="same" x="280" y="356" width="160" height="56" rx="4"/>
    <rect class="same" x="448" y="356" width="160" height="56" rx="4"/>
    <rect class="same" x="616" y="356" width="160" height="56" rx="4"/>
    <rect class="chg"  x="784" y="356" width="160" height="56" rx="4"/>
  </g>

  <g class="v" text-anchor="middle">
    <text class="ink" x="360" y="197">12 h</text><text class="ink" x="528" y="197">12 h</text>
    <text class="ink" x="696" y="197">12 h</text><text class="on" x="864" y="197">1 h</text>

    <text class="muted" x="360" y="261">none</text><text class="on" x="528" y="261">overnight</text>
    <text class="ink" x="696" y="261">overnight</text><text class="ink" x="864" y="261">overnight</text>

    <text class="muted" x="360" y="325">none</text><text class="muted" x="528" y="325">none</text>
    <text class="on" x="696" y="325">12 h soak</text><text class="on" x="864" y="325">5 min dip</text>

    <text class="ink" x="360" y="389">96-well</text><text class="ink" x="528" y="389">96-well</text>
    <text class="ink" x="696" y="389">96-well</text><text class="on" x="864" y="389">24-well</text>
  </g>

  <line x1="24" y1="432" x2="944" y2="432" stroke="#C9CED6"/>
  <text class="note muted" x="24" y="458">MCF-7 cells · MTT assay · controls: fulvestrant (positive), no drug / no material (negative)</text>
</svg>
